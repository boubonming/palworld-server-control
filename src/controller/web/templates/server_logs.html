<section class="card">
  <div class="section-heading">
    <div>
      <h2>Palworld container logs</h2>
      <p>Recent startup output from the configured Palworld container.</p>
    </div>
    <button id="refresh-server-logs" class="secondary compact" type="button">
      Refresh
    </button>
  </div>
  <div id="server-logs-error" class="flash error" hidden></div>
  <pre id="server-logs" class="activity container-logs">Loading container logs…</pre>
</section>
<script>
(() => {
  const output = document.getElementById("server-logs");
  const error = document.getElementById("server-logs-error");
  const refresh = document.getElementById("refresh-server-logs");
  const autoRefreshInterval = 5000;
  let autoRefreshTimer = null;

  async function loadServerLogs() {
    refresh.disabled = true;
    error.hidden = true;
    try {
      const response = await fetch("{{ url_for('server_logs_api') }}?tail=200");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Container logs could not be loaded.");
      output.textContent = data.logs || "The container has not written any logs yet.";
    } catch (loadError) {
      output.textContent = "";
      error.textContent = loadError.message;
      error.hidden = false;
    } finally {
      refresh.disabled = false;
    }
  }

  function scheduleAutoRefresh() {
    clearTimeout(autoRefreshTimer);
    if (!document.hidden) {
      autoRefreshTimer = setTimeout(refreshAndSchedule, autoRefreshInterval);
    }
  }

  async function refreshAndSchedule() {
    clearTimeout(autoRefreshTimer);
    await loadServerLogs();
    scheduleAutoRefresh();
  }

  refresh.addEventListener("click", refreshAndSchedule);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(autoRefreshTimer);
    } else {
      refreshAndSchedule();
    }
  });
  refreshAndSchedule();
})();
</script>
